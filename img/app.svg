<?xml version="1.0" encoding="UTF-8"?>
<!--
	Souvera Mail — Nextcloud nav icon.

	FILLED silhouette (fill="currentColor"), matching Nextcloud's other
	first-party app-grid tiles (Files, Talk, Contacts, Calendar …). The
	prior stroke-only outline rendered as an inverted-looking "empty"
	envelope in the dark-mode app grid — operator report 2026-07-01 —
	because Nextcloud's dashboard tile paints the icon black on a light-
	blue chip, and outline-only icons read as a hole punched into the
	chip whereas filled ones read as a proper silhouette.

	Design: RFC 6764-friendly envelope silhouette at the 24×24 viewBox
	Nextcloud expects. Two paths:
	  1. The envelope body — a rounded rectangle with the flap V CARVED
	     OUT as evenodd fill-rule, so we still get "letter"-recognizable
	     geometry with only a single filled shape.
	  2. A subtle upper-right accent dot representing the S in "Souvera",
	     invisible at ≤14 px (nav-bar) but recognisable at 64 px (Apps
	     settings tile).

	Both paths use fill="currentColor" so Nextcloud's NavigationManager +
	theming layer recolour correctly for light/dark mode.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
	<!--
		Envelope silhouette. Outer rounded-rect is the letter body; the
		inner "flap V" path is a knockout (evenodd) so the fold is
		visible as a negative space rather than an extra stroke on top.
	-->
	<path fill-rule="evenodd" clip-rule="evenodd" d="
		M4 5.5
		C2.9 5.5 2 6.4 2 7.5
		V16.5
		C2 17.6 2.9 18.5 4 18.5
		H20
		C21.1 18.5 22 17.6 22 16.5
		V7.5
		C22 6.4 21.1 5.5 20 5.5
		H4
		Z
		M4 7.5
		L12 12.6
		L20 7.5
		V8.9
		L12.53 13.68
		C12.21 13.88 11.79 13.88 11.47 13.68
		L4 8.9
		V7.5
		Z
	" />
</svg>
